name: EA-Ops Reference Architecture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ea-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture-gate:
    name: Validate and build architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EA-Ops architecture gate
        uses: vtavakkoli/ea-ops@dc270b716a8f30507d01c1d934d99a03a15f226a # Tested daily workspace revision
        with:
          root: .

      - name: Install EA-Ops CLI for reports
        run: python -m pip install "git+https://github.com/vtavakkoli/ea-ops.git@dc270b716a8f30507d01c1d934d99a03a15f226a"

      - name: Architecture summary
        run: |
          echo "## EA-Ops Architecture Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          eaops summary . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate architecture report and interactive portal
        run: |
          eaops report . -o architecture-report.md
          eaops build . -o site

      - name: Publish report in workflow summary
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat architecture-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ea-ops-reference-architecture
          path: |
            architecture-report.md
            site/

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Refresh repository snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          mkdir -p docs
          cp site/index.html docs/index.html
          cp architecture-report.md docs/architecture-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/architecture-report.md
          if git diff --cached --quiet; then
            echo "Published portal snapshot is already current."
          else
            git commit -m "docs: refresh generated EA portal"
            git push
          fi

  deploy-pages:
    name: Deploy EA-Ops Portal
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: architecture-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
