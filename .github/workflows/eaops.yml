name: EA-Ops Reference Architecture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  architecture-gate:
    name: Validate architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: EA-Ops architecture gate
        uses: vtavakkoli/ea-ops@main
        with:
          root: .

      - name: Install EA-Ops CLI for reports
        run: python -m pip install "git+https://github.com/vtavakkoli/ea-ops.git@main"

      - name: Architecture summary
        run: |
          echo "## EA-Ops Architecture Summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          eaops summary . >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Generate architecture report and portal
        run: |
          eaops report . -o architecture-report.md
          eaops build . -o site

      - name: Publish report in workflow summary
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat architecture-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ea-ops-reference-architecture
          path: |
            architecture-report.md
            site/

      - name: Refresh published portal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          mkdir -p docs
          cp site/index.html docs/index.html
          cp architecture-report.md docs/architecture-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/architecture-report.md
          if git diff --cached --quiet; then
            echo "Published portal is already current."
          else
            git commit -m "docs: refresh generated EA portal [skip ci]"
            git push
          fi
