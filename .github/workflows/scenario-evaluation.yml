name: Metroville Research Scenarios

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/**"
      - "model/**"
      - "relationships/**"
      - "rules/**"
      - ".github/workflows/scenario-evaluation.yml"
  push:
    branches: [main]
    paths:
      - "research/**"

permissions:
  contents: read

jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Metroville
        uses: actions/checkout@v4

      - name: Checkout EA-Ops
        uses: actions/checkout@v4
        with:
          repository: vtavakkoli/ea-ops
          path: _eaops

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache ArchiMate relationship matrix
        uses: actions/cache@v4
        with:
          path: ~/.cache/ea-ops
          key: archimate-3.2-5ec8c5f52a1de982f93838a28dcf1766c5e4f7ca

      - name: Install EA-Ops
        run: python -m pip install -e ./_eaops

      - name: Run controlled architecture-change scenarios
        run: |
          python research/run_scenarios.py             --base .             --scenarios research/scenarios             --output results/metroville-scenarios.csv             --patch-dir results/patches

      - uses: actions/upload-artifact@v4
        with:
          name: metroville-research-scenarios
          path: results/
          retention-days: 90
